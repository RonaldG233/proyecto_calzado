<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CATALOGO CLASSIC PRESTIGE MEN</title>
  <link rel="stylesheet" href="../css/catalogo.css">


  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body>
  
<!-- Aquí se cargará el header -->
  <div id="header"></div>

  <!-- Aquí se cargará el sidebar -->
  <div id="sidebar"></div>

  <main class="catalogo" id="contenedorCatalogo" >
    <!-- Aquí se insertarán los productos -->
  </main>
  <script>
    // Cargar el header y sidebar dinámicamente
    async function cargarComponentes() {
      const header = await fetch('../componentes/headerUsuario.html');
      document.getElementById('header').innerHTML = await header.text();

      const sidebar = await fetch('../componentes/sidebarUsuario.html');
      document.getElementById('sidebar').innerHTML = await sidebar.text();
    }
    cargarComponentes();
  </script>

  <script type="module" src="../js/catalogo.js"></script>
</body>
</html>

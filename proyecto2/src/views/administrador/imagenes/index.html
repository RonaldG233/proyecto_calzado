<div class="holaa">
  <div id="header-container"></div>
  <div id="sidebar-container"></div>
  <main class="imagen">
    <div class="titulo__formulario"><h2 class="formulario__titulo2">IMAGENES</h2></div>
    <section class="contenedor_formulario">
      <form id="formularioImagen" class="formulario formulario--width" enctype="multipart/form-data">
        <h2 class="formulario__titulo">Subir Imagen</h2>
        <label for="nombreImagen" class="formulario__texto">Nombre de la imagen:</label>
        <input type="text" id="nombreImagen" class="formulario__input" name="nombreImagen" maxlength="50"
          placeholder="Nombre para la imagen" required />
    
        <label for="archivo" class="formulario__texto">Seleccione la imagen:</label>
        <input type="file" id="archivo" class="formulario__input" name="archivo" accept="image/*" required />
    
        <button type="submit" class="boton boton--formulario">Subir Imagen</button>
        
        <a href="#imagenes/tablaImagenes" class="boton boton--formulario"> Ver imágenes</a>
      </form>
      <div id="respuesta"></div>
    </section>
  </main>
</div>

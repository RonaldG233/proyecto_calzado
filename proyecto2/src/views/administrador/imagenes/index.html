<div class="holaa">
<div id="header-container"></div>
  
  <div id="sidebar-container"></div>
  
<main class="imagen">
  <h2>Subir Imagen</h2>
  <form id="formularioImagen" enctype="multipart/form-data">
    <label for="nombreImagen">Nombre de la imagen:</label><br />
    <input 
      type="text" 
      id="nombreImagen" 
      name="nombreImagen" 
      maxlength="50" 
      placeholder="Ingrese un nombre para la imagen" 
      required
    /><br /><br />

    <label for="archivo">Seleccione la imagen:</label><br />
    <input 
      type="file" 
      id="archivo" 
      name="archivo" 
      accept="image/*" 
      required
    /><br /><br />

    <button type="submit">Subir Imagen</button>
    <a href="./tablaImagenes.html">
  <button type="button">Ver imágenes</button>
</a>

  </form>

  <div id="respuesta"></div>
</main>
</div>

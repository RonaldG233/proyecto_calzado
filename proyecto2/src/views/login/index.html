<div class="ventana">
  <section class="ventana_login">
    <div class="titulo_login">
      <img src="../../img/Group 7.png" class="texto_titulo">
      <div class="campos_login">
        <section class="seccion_campos_login">
          <form id="formLogin" novalidate>
            <div>
              <input class="input" type="text" name="correo" placeholder="Correo electrónico">
            </div>
            <div>
              <input class="input" type="password" name="contrasena" placeholder="Contraseña">
            </div>
            <div class="boton">
              <button type="submit" id="btnLogin" class="boton_login">INICIAR SESIÓN</button>
              <a href="#registro" class="cambio-pagina">¡Crear cuenta!</a>
            </div>
          </form>
        </section>
      </div>
    </div>
  </section>
</div>
